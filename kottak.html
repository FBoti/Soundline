<!-- FEJLÉC (minden oldalon ugyanaz) -->

  <div class="wrap">
    <a href="index.html"><img src="img/logo-sotet-hatterre.png" alt="Soundline"></a>
    <nav class="menu"><a href="index.html">Főoldal</a><a href="naptar.html">Események</a><a href="kottak.html" class="aktiv">Kották</a><a href="galeria.html">Galéria</a><a href="rolunk.html">Rólunk</a><a href="belepes.html">Belépés</a></nav>
  </div>

<main>
<section class="oldalfej"><div class="wrap"><h1>Kották</h1><p>Szűrj a saját szólamodra, és megtalálod, amit játszanod kell.</p></div></section>




<section class="szekcio">
  <div class="wrap">
    <div class="kereses">
      <div>
        <label for="kereses">Keresés</label>
        <input id="kereses" type="text" placeholder="Cím vagy szerző">
      </div>
      <div>
        <label for="szolam">Szólam</label>
        <select id="szolam">
          <option value="mind">Minden szólam</option>
          <option value="Piccolo">Piccolo</option>
          <option value="Fuvola">Fuvola</option>
          <option value="Klarinet">Klarinét</option>
          <option value="Alt-Szaxofon">Alt-Szaxofon</option>
          <option value="Trombita">Trombita</option>
          <option value="Kurt">Kürt</option>
          <option value="Tenor-Szaxofon">Tenor-Szaxofon</option>
          <option value="Baritonkurt">Baritonkürt</option>
          <option value="Harsona">Harsona</option>
          <option value="Tuba">Tuba</option>
          <option value="Dobszereles">Dobszerelés</option>
          <option value="utoshangszerek">Ütős hangszerek</option>
        </select>
      </div>
    </div>


    <p id="darab"></p>
    <!-- Ide tölti be a kottákat a kottak.js -->
    <div id="kotta-lista"></div>


    <div class="kartya feltoltes">
      <h3>Kotta feltöltése</h3>
      <button class="gomb">Fájl kiválasztása</button>
    </div>


  </div>
</section>
</main>
